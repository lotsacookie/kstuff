<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singularity OS</title><link rel="stylesheet" href="os.css"></head>
<body>
<div id="boot">
<svg class="logo" id="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <g id="ld-arm" fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
                    <path pathLength="1" d="M50 3 L83 13 L92 43 L75 69 L49 73 L35 57" stroke-width="5.5"/>
                    <path pathLength="1" d="M50 13 L76 22 L82 44 L70 62 L52 65" stroke-width="2.2" opacity="0.7"/>
                </g>
            </defs>
            <g class="ld-arms" stroke="currentColor">
                <use href="#ld-arm"/>
                <use href="#ld-arm" transform="rotate(120 50 50)"/>
                <use href="#ld-arm" transform="rotate(240 50 50)"/>
            </g>
            <g class="ld-core" fill="currentColor">
                <path d="M50.0 29.0 L51.7 45.8 L58.5 41.5 L54.2 48.3 L71.0 50.0 L54.2 51.7 L58.5 58.5 L51.7 54.2 L50.0 71.0 L48.3 54.2 L41.5 58.5 L45.8 51.7 L29.0 50.0 L45.8 48.3 L41.5 41.5 L48.3 45.8 Z"/>
            </g>
        </svg>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status">Starting up</div>
</div>
<div id="desktop" aria-hidden="true">
  <div id="launcher-panel"><div class="search"><span class="g">&#9906;</span><input placeholder="Search your device, apps, and more" disabled></div><div class="empty">No apps yet</div></div>
  <div id="shelf"><button id="launcher" aria-label="Launcher"><span></span></button></div>
  <div id="qs" role="dialog" aria-label="Quick settings">
  <div class="qs-top"><span class="qs-user">Singularity</span><span class="sp"></span><button class="qs-ic" id="lock" title="Lock">&#128274;</button><button class="qs-ic" id="power" title="Power: back to Singularity">&#9211;</button></div>
  <div class="qs-grid"><div class="tile on"><b>Network</b><small>Connected</small></div><div class="tile on"><b>Bluetooth</b><small>On</small></div><div class="tile"><b>Do not disturb</b><small>Off</small></div><div class="tile"><b>Night Light</b><small>Off</small></div></div>
  <div class="slider"><span>&#9728;</span><input type="range" min="10" max="100" value="80"></div>
  <div class="slider"><span>&#9835;</span><input type="range" min="0" max="100" value="60"></div>
  <div class="qs-foot"><span id="date"></span><span>&#9646; 100%</span></div>
</div>
<div id="tray"><span id="net" title="Wi-Fi">&#9650;</span><span id="bat" title="Battery">&#9646;</span><span id="clock"></span></div>
</div>
<script src="os.js"></script>
</body></html>
