    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body > div {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
      }

      iframe {
        border: none;
        width: 100%;
        height: 100%;
        display: block;
      }

      #eg-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        color: #eee;
        font: 14px/1.4 monospace;
        z-index: 9999;
        white-space: pre-wrap;
        padding: 16px;
        box-sizing: border-box;
        text-align: center;
      }

      #eg-status.hidden {
        display: none;
      }
    </style>
  </head>

    <div id="eg-status">Loading...</div>
    <p eg-url="PROXYURL"></p>
