name: rbxcdn-probe
on:
  workflow_dispatch:
    inputs:
      version:
        description: Roblox web client version folder
        required: true
        default: version-f4a4dba57f874ad0-RobloxWebClient

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE: https://setup.rbxcdn.com/webclient/${{ inputs.version }}
    steps:
      - name: download repo
        uses: actions/checkout@v4

      - name: fetch client files
        run: |
          mkdir -p probe
          cd probe
          curl -sS -D WasmPlayer.js.headers -o WasmPlayer.js "$BASE/WasmPlayer.js"
          curl -sS -D rbxManifest.txt.headers -o rbxManifest.txt "https://setup.rbxcdn.com/${{ inputs.version }}-rbxManifest.txt" || true
          for file in $(grep -oE '[A-Za-z0-9_./-]+\.(json|wasm|js|data)' WasmPlayer.js | sort -u | head -60); do
            echo "$file" >> referenced-files.txt
          done
          wc -c WasmPlayer.js

      - name: extract fetch logic
        run: |
          cd probe
          grep -n -o -E '.{0,200}(WebClient\.wasm|fetch failed|\.json|manifest).{0,200}' WasmPlayer.js | head -80 > fetch-context.txt || true
          head -c 4000 WasmPlayer.js > WasmPlayer.head.txt

      - name: probe header variants
        run: |
          cd probe
          probe() {
            name="$1"; shift
            code=$(curl -sS -o "body-$name.bin" -D "headers-$name.txt" -w '%{http_code} %{size_download}' "$@" "$BASE/WebClient.wasm" || echo curl-failed)
            echo "$name => $code" | tee -a probe-results.txt
            head -c 300 "body-$name.bin" | strings | head -3 >> probe-results.txt
          }
          probe plain
          probe range -H 'Range: bytes=0-1048575'
          probe roblox-origin -H 'Origin: https://www.roblox.com' -H 'Referer: https://www.roblox.com/'
          probe roblox-origin-range -H 'Origin: https://www.roblox.com' -H 'Referer: https://www.roblox.com/' -H 'Range: bytes=0-1048575'
          probe foreign-origin -H 'Origin: https://cdn.jsdelivr.net' -H 'Referer: https://cdn.jsdelivr.net/'
          probe foreign-origin-range -H 'Origin: https://cdn.jsdelivr.net' -H 'Referer: https://cdn.jsdelivr.net/' -H 'Range: bytes=0-1048575'
          probe play-origin -H 'Origin: https://play.roblox.com' -H 'Referer: https://play.roblox.com/'
          probe play-origin-range -H 'Origin: https://play.roblox.com' -H 'Referer: https://play.roblox.com/' -H 'Range: bytes=0-1048575'
          probe browser-ua -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' -H 'Origin: https://www.roblox.com'
          rm -f body-*.bin

      - name: summary
        run: |
          {
            echo "## probe results"
            echo '```'
            cat probe/probe-results.txt
            echo '```'
            echo "## WasmPlayer.js fetch context"
            echo '```'
            cat probe/fetch-context.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: commit results to log folder
        run: |
          rm -rf log
          mkdir -p log
          cp probe/probe-results.txt probe/fetch-context.txt probe/WasmPlayer.head.txt probe/referenced-files.txt probe/headers-*.txt probe/WasmPlayer.js.headers log/ 2>/dev/null || true
          cp probe/WasmPlayer.js log/WasmPlayer.js
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add log
          git commit -m "probe results" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: rbxcdn-probe
          path: probe/
          compression-level: 9
