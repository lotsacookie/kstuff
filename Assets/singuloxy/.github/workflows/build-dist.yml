name: Build dist/sandstone.js

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build:prod

      - name: Commit built dist/ back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "build: rebuild dist/ [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
