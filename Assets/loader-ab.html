<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <meta http-equiv="Pragma" content="cache">
    <meta http-equiv="Expires" content="31536000">
    <title>Study.com</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #popup-message {
            display: none;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        #popup-message h2 {
            margin-top: 0;
            font-size: 24px;
        }
        #popup-message p {
            font-size: 16px;
            color: #cccccc;
        }
    </style>
</head>
<body>
    <div id="popup-message">
        <h2>Missing Permission</h2>
        <p>Pop-up windows are required for this site. Please allow pop-ups for this site and refresh the page, or click anywhere to try again. (Next to bookmark)</p>
    </div>
    <script>
        (function () {
            if (window.name === "classroomSession") return;

            var cfg = {
                repo: "lotsacookie/kstuff",
                search: location.search,
                home: location.href.replace(/[^\/]*$/, "")
            };

            var boot = function (cfg) {
                var guard = function (e) {
                    if (window.__sgReloading) return;
                    e.preventDefault();
                    e.returnValue = "";
                    return "";
                };
                var arm = function () {
                    addEventListener("beforeunload", guard);
                    onbeforeunload = guard;
                };
                arm();

                var timed = function (u, ms) {
                    var c = new AbortController();
                    var t = setTimeout(function () { c.abort(); }, ms);
                    return fetch(u, { signal: c.signal }).finally(function () { clearTimeout(t); });
                };

                var resolveVersion = async function () {
                    try {
                        var r = await timed("https://api.github.com/repos/" + cfg.repo + "/commits/main", 3000);
                        if (r.ok) {
                            var d = await r.json();
                            if (d && /^[0-9a-f]{40}$/i.test(d.sha)) return d.sha;
                        }
                    } catch (e) {}
                    try {
                        var r2 = await timed("https://data.jsdelivr.com/v1/packages/gh/" + cfg.repo + "/resolved?specifier=main&t=" + Date.now(), 3000);
                        if (r2.ok) {
                            var d2 = await r2.json();
                            if (d2 && /^[0-9a-f]{40}$/i.test(d2.version)) return d2.version;
                        }
                    } catch (e) {}
                    return "main";
                };

                (async function () {
                    var v = await resolveVersion();
                    var mirrors = [
                        "https://cdn.jsdelivr.net/gh/" + cfg.repo + "@" + v + "/",
                        "https://raw.githubusercontent.com/" + cfg.repo + "/" + v + "/",
                        "https://raw.githack.com/" + cfg.repo + "/" + v + "/",
                        "https://cdn.statically.io/gh/" + cfg.repo + "/" + v + "/",
                        cfg.home
                    ];
                    for (var i = 0; i < mirrors.length; i++) {
                        var m = mirrors[i];
                        try {
                            var r = await fetch(m + "build.html" + cfg.search, { cache: "no-cache" });
                            if (!r.ok) continue;
                            var h = await r.text();
                            var tag = '<base href="' + m + 'build.html">';
                            var out = /<head>/i.test(h) ? h.replace(/<head>/i, "<head>" + tag) : tag + h;
                            document.open();
                            document.write(out);
                            document.close();
                            arm();
                            return;
                        } catch (e) {}
                    }
                    document.body.textContent = "Failed to load: all mirrors unavailable";
                })();
            };

            var shell =
                '<!doctype html><html><head><meta charset="utf-8">' +
                '<meta name="viewport" content="width=device-width,initial-scale=1">' +
                '<title>My learning | Vocabulary.com</title>' +
                '<link rel="icon" href="https://www.google.com/s2/favicons?domain=vocab.com">' +
                '</head><body style="margin:0;background:#000;color:#fff"><script>(' +
                boot.toString() + ')(' + JSON.stringify(cfg) + ')<\/script></body></html>';

            function launch(w) {
                w.name = "classroomSession";
                w.document.open();
                w.document.write(shell);
                w.document.close();
                window.location.replace("https://clever.com");
            }

            function open() {
                var w = null;
                try {
                    w = window.open("about:blank", "_blank", "width=1000,height=700");
                } catch (e) {
                    w = null;
                }
                if (!w || w.closed || typeof w.closed === "undefined") return false;
                launch(w);
                return true;
            }

            if (!open()) {
                document.getElementById("popup-message").style.display = "block";
                var retry = function () {
                    if (open()) {
                        removeEventListener("click", retry);
                        removeEventListener("keydown", retry);
                    }
                };
                addEventListener("click", retry);
                addEventListener("keydown", retry);
            }
        })();
    </script>
</body>
</html>
