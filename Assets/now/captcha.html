<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human check</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d10;color:#f2f5f7;font:500 15px system-ui,sans-serif;text-align:center;padding:16px}small{color:#98a2ad}</style></head>
<body>
<p>Solve the check to continue.</p>
<div id="c"></div>
<small id="m"></small>
<script>
const KEY = "3443d8f6-da7a-4326-929f-4d7fc89ab0d1";
const m = document.getElementById("m");
function done(t) {
  try { (window.opener || parent).postMessage({ type: "now-captcha", token: t }, location.origin); m.textContent = "Done. You can close this window."; setTimeout(() => window.close(), 400); }
  catch (e) { m.textContent = "Could not return to the sign-up page. Reopen it from there."; }
}
window.onLoad = () => hcaptcha.render("c", { sitekey: KEY, theme: "dark", callback: done, "error-callback": (e) => { m.textContent = "Captcha error: " + e; } });
const s = document.createElement("script");
s.src = "https://hcaptcha.com/1/api.js?render=explicit&onload=onLoad"; s.async = true;
s.onerror = () => { m.textContent = "Could not load hCaptcha in this window."; };
document.head.appendChild(s);
</script></body></html>
