name: Crawl login

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-login
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl login.nvidia.com into ref/login
        run: |
          rm -rf ref/login
          python scripts/crawl_login.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ref/login
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ref/login crawl"
            git pull --rebase origin main
            git push origin main
          fi
