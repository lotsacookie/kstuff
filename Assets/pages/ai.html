<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AI</title>
<script>try{if(top!==self)document.documentElement.classList.add("sg-embedded")}catch(e){document.documentElement.classList.add("sg-embedded")}</script>
<style>
html.sg-embedded,html.sg-embedded body{background:transparent!important;background-image:none!important}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background-color: #000;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255, 255, 255, 0.07), transparent 70%),
    linear-gradient(to right, rgba(255, 255, 255, 0.13) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.13) 1px, transparent 1px);
  background-size: 100% 100%, 44px 44px, 44px 44px;
  color: #fff;
  font: bold 14px/1.5 "Comfortaa", sans-serif;
}
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
#err {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
  display: none; align-items: center; gap: 10px; max-width: calc(100vw - 24px);
  padding: 8px 12px; background: #141414; border: 1px solid #ff5d6c;
}
#err.on { display: flex; }
#err button {
  font: inherit; color: #000; background: #fff; border: 1px solid #fff; padding: 4px 12px; cursor: pointer;
}
#err button:hover { background: #000; color: #fff; }
</style>
</head>
<body>
<iframe id="app" title="DeepAI" allow="clipboard-read; clipboard-write; microphone; fullscreen"></iframe>
<div id="err"><span id="err-text"></span><button id="retry" type="button">Retry</button></div>
<script src="js/net-client.js"></script>
<script src="js/ai-doc.js"></script>
<script>
(function () {
  var frame = document.getElementById('app');
  var err = document.getElementById('err');
  var errText = document.getElementById('err-text');
  var ready = false, mounting = false;
  var STALE_MS = 25 * 60 * 1000;
  var noop = function () {};

  function signal() { try { parent.postMessage({ type: 'kstuff-frame-ready' }, '*'); } catch (e) {} }

  window.__px = function (req) { return window.kAiDoc.px(req); };
  window.__pxReady = function () { ready = true; signal(); };

  function show(html) {
    err.classList.remove('on');
    ready = false;
    frame.srcdoc = html;
    signal();
  }

  function fail(e) {
    errText.textContent = 'Could not load DeepAI: ' + ((e && e.message) || e);
    err.classList.add('on');
    signal();
  }

  async function mount(force) {
    if (mounting) return;
    mounting = true;
    try {
      var rec = force ? null : await window.kAiDoc.load();
      if (rec) {
        show(rec.html);
        if (Date.now() - rec.at > STALE_MS) window.kAiDoc.ensure(false).catch(noop);
      } else {
        show(await window.kAiDoc.ensure(true));
      }
    } catch (e) {
      fail(e);
    } finally {
      mounting = false;
    }
  }

  frame.addEventListener('load', function () {
    var ours = false;
    try { ours = Boolean(frame.contentWindow.__pxShim); } catch (e) {}
    if (!ours && ready) mount(false);
  });

  document.getElementById('retry').addEventListener('click', function () { mount(true); });

  mount(false);
})();
</script>
</body>
</html>
