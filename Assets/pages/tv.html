<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Comfortaa", sans-serif !important;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #1a1216;
    --text: #ffb8d9;
    --card: rgba(255, 255, 255, 0.06);
    --nav: rgba(26, 18, 22, 0.94);
    --hover: color-mix(in srgb, var(--text) 14%, transparent);
    --hover-strong: color-mix(in srgb, var(--text) 24%, transparent);
    --muted: color-mix(in srgb, var(--text) 62%, transparent);
    --border: color-mix(in srgb, var(--text) 16%, transparent);
    --header-h: 68px;
}

html, body { min-height: 100%; }

body {
    background-color: var(--bg);
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    color: var(--text);
    overflow-x: hidden;
}

[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
svg { display: block; flex-shrink: 0; }

.bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    height: var(--header-h);
    padding: 0 16px;
    background: var(--nav);
    border-bottom: 1px solid var(--border);
}

.modes {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 500px;
    background: var(--card);
    border: 1px solid var(--border);
    flex: none;
}
.mode {
    height: 38px;
    padding: 0 22px;
    border: 0;
    border-radius: 500px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
}
.mode:hover { color: var(--text); }
.mode[aria-selected="true"] { background: var(--text); color: var(--bg); }
.mode:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.search-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 520px;
    height: 46px;
    margin: 0 auto;
    padding: 0 18px;
    border-radius: 500px;
    background: var(--card);
    border: 2px solid var(--border);
    color: var(--muted);
    transition: border-color 0.2s, background 0.2s;
}
.search-box:hover { background: var(--hover); }
.search-box:focus-within { border-color: var(--text); }
.search-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-size: 1rem;
}
.search-box input::placeholder { color: var(--muted); }
.bar-end { width: 1px; flex: none; }

.panel { padding: 18px 16px 40px; max-width: 1500px; margin: 0 auto; }

.pill {
    height: 40px;
    padding: 0 20px;
    border: 1px solid var(--border);
    border-radius: 500px;
    background: var(--card);
    cursor: pointer;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
}
.pill:hover { background: var(--hover); border-color: var(--text); }
.pill:disabled { opacity: 0.4; pointer-events: none; }
.pill.solid { background: var(--text); color: var(--bg); border-color: var(--text); }
.pill.solid:hover { transform: scale(1.04); }

.message { grid-column: 1 / -1; padding: 40px 8px; text-align: center; color: var(--muted); }
.message .pill { margin-top: 14px; }

.spinner {
    position: relative;
    width: 110px;
    height: 3px;
    border-radius: 0;
    overflow: hidden;
    background: var(--hover-strong);
}
.spinner::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 40%;
    border-radius: 0;
    background: var(--text);
    animation: bar-bounce 1s ease-in-out infinite alternate;
}
@keyframes bar-bounce { from { transform: translateX(0); } to { transform: translateX(150%); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 0.45; } }

.feat {
    position: relative;
    min-height: 340px;
    margin-bottom: 26px;
    border-radius: 16px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
}
.feat img.bd {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s;
}
.feat img.bd.in { opacity: 1; }
.feat::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, var(--bg) 4%, transparent 75%), linear-gradient(to right, rgba(0, 0, 0, 0.55), transparent 65%);
}
.feat-in { position: relative; z-index: 1; padding: 28px; max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
.feat-title { font-size: 2rem; line-height: 1.15; }
.feat-meta { font-size: 0.9rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.feat-over {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.feat-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

.sec { margin-bottom: 26px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
.sec-title { font-size: 1.2rem; font-weight: 700; }
.row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 4px 2px 12px;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
}
.row > .card { flex: none; width: 150px; scroll-snap-align: start; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

.card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0;
    border: 0;
    background: transparent;
    text-align: left;
    cursor: pointer;
    min-width: 0;
}
.poster {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 10px;
    overflow: hidden;
    background: var(--hover);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-weight: 700;
    transition: transform 0.2s, border-color 0.2s;
}
.poster img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }
.poster img.in { opacity: 1; }
.card:hover .poster, .card:focus-visible .poster { transform: translateY(-4px); border-color: var(--text); }
.card:focus-visible { outline: none; }
.card-t { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-s { margin-top: -4px; font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank {
    position: absolute;
    left: 6px;
    bottom: 4px;
    font-size: 2.4rem;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
}
.cwrap { position: relative; flex: none; width: 150px; scroll-snap-align: start; min-width: 0; }
.cwrap > .card { width: 100%; }
.cwrap .cx {
    position: absolute; top: 6px; right: 6px; z-index: 2; width: 26px; height: 26px; padding: 0;
    border: 1px solid var(--border); border-radius: 50%; background: rgba(0, 0, 0, 0.65); color: var(--text);
    font-size: 0.8rem; line-height: 1; cursor: pointer; opacity: 0; transition: opacity 0.15s;
}
.cwrap:hover .cx, .cwrap .cx:focus-visible { opacity: 1; }
@media (hover: none) { .cwrap .cx { opacity: 1; } }
.bar-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, 0.5); }
.bar-prog i { display: block; height: 100%; background: var(--text); }
.skel .poster { animation: pulse 1.4s ease-in-out infinite; }

.more { grid-column: 1 / -1; display: flex; justify-content: center; padding: 8px 0 24px; }

.modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px;
    background: rgba(0, 0, 0, 0.7);
    overflow-y: auto;
}
.modal.open { display: flex; }
.box {
    position: relative;
    width: 100%;
    max-width: 860px;
    border-radius: 16px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
}
.hero { position: relative; min-height: 260px; display: flex; align-items: flex-end; background: var(--card); }
.hero img.bd { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
.hero img.bd.in { opacity: 1; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg), transparent 80%); }
.hero-in { position: relative; z-index: 1; display: flex; gap: 16px; align-items: flex-end; padding: 20px; width: 100%; }
.hero-p { width: 110px; flex: none; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--hover); border: 1px solid var(--border); }
.hero-p img { width: 100%; height: 100%; object-fit: cover; }
.hero-t h2 { font-size: 1.6rem; line-height: 1.2; }
.hero-meta { margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.x {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
    cursor: pointer;
}
.x:hover { background: var(--hover-strong); }
.body { padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 2px 6px; }
.chipbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.chipbar::-webkit-scrollbar { display: none; }
.chipbar .sn { flex: none; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 4px 12px; border-radius: 500px; background: var(--hover); font-size: 0.78rem; }
.tag { font-style: italic; color: var(--muted); }
.over { line-height: 1.6; font-size: 0.95rem; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

.seasons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.sn { min-width: 40px; height: 36px; padding: 0 12px; border-radius: 500px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 700; }
.sn:hover { background: var(--hover); }
.sn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.eps { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ep { display: flex; gap: 12px; padding: 8px; border-radius: 10px; background: var(--card); border: 1px solid transparent; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.ep:hover, .ep:focus-visible { background: var(--hover); border-color: var(--border); outline: none; }
.ep.soon { opacity: 0.5; cursor: default; }
.ep-img { position: relative; width: 150px; flex: none; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--hover); }
.ep-img img { width: 100%; height: 100%; object-fit: cover; }
.ep-n { position: absolute; left: 6px; top: 4px; font-size: 0.8rem; font-weight: 700; text-shadow: 0 1px 6px #000; color: #fff; }
.ep-t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ep-name { font-weight: 700; font-size: 0.95rem; }
.ep-desc { font-size: 0.8rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep-st { font-size: 0.75rem; color: var(--muted); }

.player { position: fixed; inset: 0; z-index: 60; display: none; background: #000; }
.player.open { display: block; }
.player video { width: 100%; height: 100%; background: #000; }
.p-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 14px; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent); z-index: 2; transition: opacity 0.3s; }
.player.idle .p-top { opacity: 0; pointer-events: none; }
.p-titles { min-width: 0; flex: 1; }
.p-t1 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.p-t2 { font-size: 0.8rem; color: rgba(255, 255, 255, 0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-btn { height: 40px; padding: 0 16px; border-radius: 500px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.5); color: #fff; cursor: pointer; font-weight: 700; white-space: nowrap; }
.p-btn:hover { background: rgba(255, 255, 255, 0.2); }
.p-stat { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #fff; background: rgba(0, 0, 0, 0.6); pointer-events: none; }
.p-stat .pill { pointer-events: auto; color: #fff; }

.live { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1000px) {
    .live { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); align-items: start; }
    .stage { position: sticky; top: calc(var(--header-h) + 16px); }
}
.stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 72vh; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--border); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); }
.screen video { width: 100%; height: 100%; display: block; background: #000; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: rgba(0, 0, 0, 0.72); pointer-events: none; color: #fff; }
.overlay.click { pointer-events: auto; cursor: pointer; }
.now { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); min-width: 0; }
.now-logo { width: 56px; height: 56px; flex: none; border-radius: 8px; background: var(--hover); display: grid; place-items: center; overflow: hidden; font-weight: 700; }
.now-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.now-text { min-width: 0; flex: 1; }
.now-name, .now-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-name { font-size: 1.1rem; font-weight: 700; }
.now-meta { margin-top: 4px; font-size: 0.85rem; color: var(--muted); }
.browser { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.select { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 0.95rem; outline: none; cursor: pointer; }
.select:focus { border-color: var(--text); }
.select option { background: var(--bg); color: var(--text); }
.count { font-size: 0.85rem; color: var(--muted); padding: 0 4px; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ch { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid transparent; border-radius: 10px; background: var(--card); text-align: left; cursor: pointer; min-width: 0; transition: background 0.2s, border-color 0.2s; }
.ch:hover, .ch:focus-visible { background: var(--hover); border-color: var(--border); outline: none; }
.ch.active { background: var(--hover-strong); border-color: var(--text); }
.ch-logo { width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; background: var(--hover); display: grid; place-items: center; overflow: hidden; font-size: 1.4rem; font-weight: 700; }
.ch-logo img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
.ch-name, .ch-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-name { font-size: 0.95rem; font-weight: 700; }
.ch-meta { margin-top: -6px; font-size: 0.78rem; color: var(--muted); }
.sentinel { height: 1px; }

.has-vc { outline: none; user-select: none; -webkit-user-select: none; }
.has-vc.idle { cursor: none; }
.has-vc.idle .vc, .has-vc.idle .p-top { opacity: 0; pointer-events: none; }
.has-vc:fullscreen { background: #000; max-height: none; border-radius: 0; }
.has-vc:fullscreen video { height: 100%; }
.vc {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 28px 14px 10px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
    color: #fff;
    transition: opacity 0.3s;
}
.vc-seek { position: relative; height: 18px; margin-bottom: 4px; cursor: pointer; touch-action: none; }
.vc-seek::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); transition: height 0.15s, top 0.15s; }
.vc-seek:hover::before { top: 6px; height: 6px; }
.vc-buf, .vc-fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 4px; width: 0; pointer-events: none; transition: height 0.15s, top 0.15s; }
.vc-seek:hover .vc-buf, .vc-seek:hover .vc-fill { top: 6px; height: 6px; }
.vc-buf { background: rgba(255, 255, 255, 0.35); }
.vc-fill { background: var(--text); }
.vc-thumb { position: absolute; top: 9px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--text); transform: scale(0); transition: transform 0.15s; pointer-events: none; }
.vc-seek:hover .vc-thumb { transform: scale(1); }
.vc-tip { position: absolute; bottom: 20px; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.85); font-size: 0.75rem; opacity: 0; pointer-events: none; white-space: nowrap; }
.vc-seek:hover .vc-tip { opacity: 1; }
.vc-row { display: flex; align-items: center; gap: 4px; }
.vc-btn { width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; transition: background 0.15s; }
.vc-btn:hover, .vc-btn:focus-visible { background: rgba(255, 255, 255, 0.2); outline: none; }
.vc-vol { width: 70px; margin: 0 6px; accent-color: var(--text); cursor: pointer; }
.vc-time { font-size: 0.85rem; font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; }
.vc-spacer { flex: 1; }
.vc-menu { position: absolute; right: 14px; bottom: 76px; z-index: 4; min-width: 200px; max-height: 60%; overflow-y: auto; padding: 6px; border-radius: 12px; background: rgba(16, 10, 13, 0.96); border: 1px solid var(--border); color: #fff; }
.vc-item { width: 100%; display: flex; justify-content: space-between; gap: 18px; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: #fff; cursor: pointer; text-align: left; font-size: 0.9rem; }
.vc-item:hover { background: rgba(255, 255, 255, 0.14); }
.vc-item.on { color: var(--text); font-weight: 700; }
.vc-item.on::after { content: '✓'; }
.vc-back { opacity: 0.7; }
.vc-val { opacity: 0.7; }
.vc-empty { padding: 10px 12px; font-size: 0.85rem; opacity: 0.7; }
.player video, .screen video { object-fit: contain; }
@media (max-width: 700px) {
    .vc-vol { display: none; }
    .vc-btn { width: 36px; height: 36px; }
}
.cskel { aspect-ratio: 1; border-radius: 10px; background: var(--card); animation: pulse 1.4s ease-in-out infinite; }

@media (max-width: 700px) {
    .bar { gap: 8px; padding: 0 10px; }
    .mode { padding: 0 14px; font-size: 0.85rem; }
    .panel { padding: 12px 10px 40px; }
    .feat { min-height: 260px; }

    .row > .card, .cwrap { width: 120px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

    .ep-img { width: 110px; }
}
@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

button:not(:disabled):not(.fav-tile):hover i,button:not(:disabled):not(.fav-tile):hover span,button:not(:disabled):not(.fav-tile):focus-visible i,button:not(:disabled):not(.fav-tile):focus-visible span{color:var(--bg)!important}
button:not(:disabled):not(.fav-tile):hover svg,button:not(:disabled):not(.fav-tile):focus-visible svg{color:var(--bg)!important}
button:not(:disabled):not(.fav-tile):hover svg:not([fill="none"]),button:not(:disabled):not(.fav-tile):focus-visible svg:not([fill="none"]){fill:var(--bg)!important}
button:not(:disabled):not(.fav-tile):hover svg[fill="none"],button:not(:disabled):not(.fav-tile):focus-visible svg[fill="none"]{stroke:var(--bg)!important}
</style>
</head>
<body>

<div class="bar">
    <div class="modes" role="tablist" aria-label="TV sections">
        <button class="mode" role="tab" id="tab-movies" aria-controls="panel-movies" aria-selected="true" data-mode="movies" type="button">Movies</button>
        <button class="mode" role="tab" id="tab-live" aria-controls="panel-live" aria-selected="false" data-mode="live" type="button">Live TV</button>
    </div>
    <label class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search movies and shows" autocomplete="off" spellcheck="false">
    </label>
    <div class="bar-end"></div>
</div>

<section class="panel" id="panel-movies" role="tabpanel" aria-labelledby="tab-movies">
    <div id="mvResults" hidden>
        <div class="sec-head"><h2 class="sec-title" id="mvResTitle"></h2><span class="count" id="mvCount"></span></div>
        <div class="grid" id="mvGrid"></div>
    </div>
    <div id="mvHome">
        <div class="feat" id="mvFeat" hidden></div>
        <div id="mvCont" hidden></div>
        <div id="mvSecs"></div>
    </div>
</section>

<section class="panel" id="panel-live" role="tabpanel" aria-labelledby="tab-live" hidden>
    <div class="live">
        <div class="stage">
            <div class="screen">
                <video id="video" playsinline autoplay></video>
                <div class="overlay" id="overlay">
                    <div>Pick a channel to start watching.</div>
                </div>
            </div>
            <div class="now" id="now" hidden>
                <div class="now-logo" id="nowLogo"></div>
                <div class="now-text">
                    <div class="now-name" id="nowName"></div>
                    <div class="now-meta" id="nowMeta"></div>
                </div>
                <button class="pill" id="altBtn" type="button" hidden>Try another feed</button>
            </div>
        </div>
        <div class="browser">
            <div class="filters">
                <select class="select" id="country" aria-label="Country"></select>
                <select class="select" id="category" aria-label="Category"></select>
            </div>
            <div class="count" id="count"></div>
            <div class="chgrid" id="grid"></div>
            <div class="sentinel" id="sentinel"></div>
        </div>
    </div>
</section>

<div class="modal" id="mvModal"><div class="box" id="mvBox" role="dialog" aria-modal="true"></div></div>
<div class="player" id="mvPlayer"></div>

<script src="js/net-client.js"></script>
<script src="js/tv-core.js"></script>
<script src="js/tv-player.js"></script>
<script src="js/tv-live.js"></script>
<script src="js/tv-movies.js"></script>
<script src="js/asteroids.js" data-speed="2.4" data-alpha="0.5" data-z="-1" defer></script>
</body>
</html>
