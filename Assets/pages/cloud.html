<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<!-- SingularityCloud runs in its own frame, so it keeps its own storage and its own loader
     (GitHub API + jsDelivr + cache) and can't be affected by this page. It always loads the latest build. -->
<iframe id="sc" title="SingularityCloud"
  src="https://rtischeduler.github.io/SingularityCloud/"
  allow="autoplay; fullscreen; clipboard-read; clipboard-write; gamepad; microphone; camera; pointer-lock; keyboard-map"
  allowfullscreen></iframe>
</body>
</html>
