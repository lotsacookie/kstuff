<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1216;
            --text: #ffb8d9;
            --card: rgba(255, 255, 255, 0.06);
            --nav: rgba(26, 18, 22, 0.85);
        }
        * { font-family: "Quicksand", sans-serif !important; box-sizing: border-box; }
        body { background: none; color: var(--text); margin: 0; display: flex; height: 100vh; height: 100dvh; overflow: hidden; font-weight: bold; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 25%, transparent); border-radius: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        button:focus-visible, input:focus-visible, .chat-item:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

        #sidebar { width: 320px; min-width: 320px; background-color: var(--nav); border-right: 1px solid color-mix(in srgb, var(--text) 14%, transparent); display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 22px 22px 8px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { margin: 0; font-size: 1.5rem; font-weight: 900 !important; letter-spacing: -0.01em; }
        .sidebar-actions { padding: 12px 16px 14px; display: flex; gap: 8px; }
        .sidebar-btn { flex: 1; background-color: var(--card); color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 22%, transparent); padding: 11px; border-radius: 999px; font-weight: 900 !important; cursor: pointer; font-size: 0.92rem; transition: background 0.2s, transform 0.15s; text-align: center; }
        .sidebar-btn:hover { background-color: color-mix(in srgb, var(--text) 16%, transparent); }
        .sidebar-btn:active { transform: scale(0.97); }
        #chat-list { flex: 1; overflow-y: auto; padding: 6px 10px 14px; display: flex; flex-direction: column; gap: 4px; }
        .chat-item { padding: 10px 12px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; font-size: 1rem; color: var(--text); background: transparent; transition: background 0.2s; position: relative; }
        .chat-item:hover { background-color: var(--card); }
        .chat-item.active { background-color: color-mix(in srgb, var(--text) 14%, transparent); }
        .chat-item.active::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 4px; border-radius: 0 4px 4px 0; background: var(--text); }
        .avatar-wrapper { position: relative; width: 44px; height: 44px; margin-right: 12px; flex-shrink: 0; }
        .chat-avatar { width: 100%; height: 100%; }
        .chat-avatar, .header-avatar, .user-list-avatar { border-radius: 50%; background-color: var(--card); border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); object-fit: cover; }
        .header-avatar, .user-list-avatar { width: 45px; height: 45px; }
        .header-avatar { width: 40px; height: 40px; }
        .unread-indicator { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; background-color: #ff3d6e; border-radius: 50%; border: 2px solid var(--bg); display: none; }
        .chat-item.unread .unread-indicator { display: block; }
        .chat-item.unread .chat-title { color: #fff; }
        .chat-info, .user-list-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .chat-title, .user-list-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900 !important; }
        .chat-preview, .user-list-desc { font-size: 0.8rem; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

        #main-content { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; background: transparent; }
        header { background-color: var(--nav); padding: 0 24px; border-bottom: 1px solid color-mix(in srgb, var(--text) 14%, transparent); display: flex; align-items: center; justify-content: space-between; height: 72px; flex-shrink: 0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .header-user-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .header-name { font-size: 1.15rem; font-weight: 900 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-actions { display: flex; gap: 8px; }

        #chat-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 28px clamp(14px, 4vw, 48px) 18px; display: flex; flex-direction: column; gap: 10px; transition: opacity 220ms cubic-bezier(.2,.9,.2,1), transform 220ms cubic-bezier(.2,.9,.2,1); opacity: 0; transform: translateY(6px); will-change: opacity, transform; }
        #chat-container.visible { opacity: 1; transform: translateY(0); }
        .section-loader { position: absolute; inset: 0; width: 100%; height: 100%; background: color-mix(in srgb, var(--bg) 85%, transparent); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; z-index: 1000; opacity: 1; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .section-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--card); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 1.5rem; }
        .loading-text { font-size: 0.9rem; font-weight: 900 !important; letter-spacing: .25em; text-transform: uppercase; animation: pulse 1.5s ease-in-out infinite; }
        .empty-state { margin: auto; text-align: center; opacity: 0.55; max-width: 260px; line-height: 1.5; }
        @keyframes spin { 0% { transform: rotate(0) } 100% { transform: rotate(360deg) } }
        @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
        @keyframes slideInMessage { 0% { opacity: 0; transform: translateY(12px) scale(0.985); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .slide-in { animation: slideInMessage 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }

        .message-row { display: flex; align-items: flex-end; gap: 10px; max-width: min(78%, 620px); min-width: 0; }
        .message-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.friend-row { align-self: flex-start; }
        .message-row.cont-prev { margin-top: -8px; }
        .msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); flex-shrink: 0; background: var(--card); }
        .message-row.cont-next .msg-avatar { visibility: hidden; }
        .user-row .msg-avatar { display: none; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 100%; min-width: 0; }
        .user-row .message-wrapper { align-items: flex-end; }
        .friend-row .message-wrapper { align-items: flex-start; }
        .sender-name { font-size: 0.75rem; opacity: 0.75; margin: 0 0 4px 12px; display: block; }

        .message { padding: 10px 16px; border-radius: 22px; line-height: 1.45; font-size: 1rem; font-weight: bold; word-break: break-word; overflow-wrap: break-word; white-space: pre-wrap; max-width: 100%; position: relative; }
        .user-message { background: linear-gradient(135deg, var(--text), color-mix(in srgb, var(--text) 72%, var(--bg))); color: var(--bg); box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--text) 60%, transparent); }
        .friend-message { background-color: var(--card); color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 18%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .user-row .message { border-bottom-right-radius: 6px; }
        .friend-row .message { border-bottom-left-radius: 6px; }
        .user-row.cont-prev .message { border-top-right-radius: 6px; }
        .friend-row.cont-prev .message { border-top-left-radius: 6px; }
        .message.media-msg { padding: 5px; }
        .message img, .message video { max-width: 100%; max-height: 360px; border-radius: 17px; display: block; }
        .message audio { max-width: 100%; height: 40px; outline: none; border-radius: 20px; display: block; }
        .timestamp { font-size: 0.72rem; opacity: 0.5; margin: 5px 6px 4px; font-weight: 500; }

        #input-container { padding: 12px clamp(14px, 4vw, 48px) 20px; display: flex; flex-shrink: 0; }
        .composer { flex: 1; display: flex; gap: 8px; align-items: center; background: var(--nav); border: 1px solid color-mix(in srgb, var(--text) 22%, transparent); border-radius: 999px; padding: 6px 6px 6px 8px; transition: border-color 0.2s, box-shadow 0.2s; }
        .composer:focus-within { border-color: var(--text); box-shadow: 0 0 0 4px color-mix(in srgb, var(--text) 14%, transparent); }
        .composer input[type="text"] { flex: 1; min-width: 0; background: transparent; color: var(--text); border: none; border-radius: 999px; padding: 12px 16px; font-size: 1rem; font-weight: bold; outline: none; }
        .composer input[type="text"]::placeholder { color: var(--text); opacity: 0.45; }
        .composer input[type="text"]:disabled { opacity: 0.5; }
        button#send-btn { background-color: var(--text); color: var(--bg); border: none; padding: 12px 24px; border-radius: 999px; font-weight: 900 !important; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s, opacity 0.2s; }
        button#send-btn:hover:not(:disabled) { opacity: 0.9; }
        button#send-btn:active:not(:disabled) { transform: scale(0.96); }
        button#send-btn:disabled { opacity: 0.3; cursor: default; }

        input[type="text"].modal-input { background: var(--card); color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 22%, transparent); border-radius: 14px; padding: 12px 16px; font-size: 1rem; font-weight: bold; outline: none; width: 100%; }
        input[type="text"].modal-input:focus { border-color: var(--text); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 220ms ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-overlay.closing { opacity: 0; pointer-events: none; }
        .modal-box { background-color: var(--bg); border: 1px solid color-mix(in srgb, var(--text) 22%, transparent); border-radius: 24px; padding: 24px; width: 90%; max-width: 450px; display: flex; flex-direction: column; gap: 14px; transform: translateY(-8px) scale(0.96); opacity: 0; transition: transform 260ms cubic-bezier(.2,.9,.2,1), opacity 200ms linear; will-change: transform, opacity; }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); opacity: 1; }
        .modal-overlay.closing .modal-box { transform: translateY(8px) scale(0.95); opacity: 0; }
        .modal-box h3 { margin: 0; font-size: 1.15rem; }
        .user-list-container { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .user-list-item { display: flex; align-items: center; background: var(--card); padding: 10px 12px; border-radius: 16px; gap: 12px; border: 1px solid transparent; transition: all 0.2s ease; }
        .user-list-item.selected { border-color: var(--text); background-color: color-mix(in srgb, var(--text) 15%, var(--card)); }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
        .modal-btn { padding: 9px 18px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); background: var(--card); color: var(--text); font-weight: 900 !important; cursor: pointer; transition: opacity 0.2s, transform 0.15s; }
        .modal-btn.primary { background-color: var(--text); color: var(--bg); border: none; }
        .modal-btn.danger { background-color: rgba(255, 61, 110, 0.14); border-color: #ff3d6e; color: #ff8fa9; }
        .modal-btn:hover { opacity: 0.9; }
        .modal-btn:active { transform: scale(0.96); }

        @media (max-width: 720px) {
            #sidebar { width: 96px; min-width: 96px; }
            .sidebar-header { justify-content: center; padding: 18px 8px 6px; }
            .sidebar-header h3 { font-size: 1.1rem; }
            .sidebar-actions { flex-direction: column; padding: 8px; }
            .sidebar-btn { padding: 9px 4px; font-size: 0.8rem; }
            .chat-info { display: none; }
            .chat-item { justify-content: center; padding: 10px 4px; }
            .avatar-wrapper { margin-right: 0; }
            .message-row { max-width: 88%; }
            header { padding: 0 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header"><h3>Chat</h3></div>
        <div class="sidebar-actions">
            <button id="new-chat-btn" class="sidebar-btn">+ User</button>
            <button id="new-group-btn" class="sidebar-btn">+ Group</button>
        </div>
        <div id="chat-list"><div style="padding: 15px; font-size: 0.85rem; opacity: 0.6;">Waiting for user data...</div></div>
    </div>
    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h3 id="modal-title">Start Conversation</h3>
            <input type="text" class="modal-input" id="group-name-input" placeholder="Group Name (e.g. Squad)" style="display:none;">
            <input type="text" class="modal-input" id="user-search-input" placeholder="Search users by username...">
            <div id="user-list-container" class="user-list-container"></div>
            <div class="modal-buttons">
                <button id="modal-cancel" class="modal-btn">Close</button>
                <button id="modal-create-group" class="modal-btn primary" style="display:none;">Create Group</button>
            </div>
        </div>
    </div>
    <div id="main-content">
        <header>
            <div class="header-user-info">
                <img class="header-avatar" id="header-avatar-icon" src="" alt="Avatar" style="display:none;">
                <span class="header-name" id="header-username">Select a chat</span>
            </div>
            <div class="header-actions">
                <button id="add-member-btn" class="modal-btn" style="display: none;">Add Members</button>
                <button id="delete-chat-btn" class="modal-btn danger" style="display: none;">Delete Chat</button>
                <button id="leave-group-btn" class="modal-btn danger" style="display: none;">Leave Group</button>
            </div>
        </header>
        <div id="chat-wrapper">
            <div id="chat-container"></div>
            <div id="section-loader" class="section-loader hidden">
                <div class="spinner"></div>
                <div class="loading-text">Loading</div>
            </div>
        </div>
        <div id="input-container">
            <div class="composer">
                <input type="text" id="user-input" placeholder="Type a message" disabled>
                <button id="send-btn" disabled><span>Send</span></button>
            </div>
        </div>
    </div>
    <iframe id="backend-frame" style="display:none;"></iframe>
<script src="js/chat-app.js"></script>
</body>
</html>
