<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WebBlox</title>
<style>html,body{margin:0;height:100%;background:#18191c;color:#bdbebe;font:14px system-ui,sans-serif}#wb-wait{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}#wb-wait button{margin-top:12px;padding:8px 16px;border:0;border-radius:6px;background:#335fff;color:#fff;font:inherit;cursor:pointer}</style>
<script>
  // Console bridge: send this frame's console output, errors and failed loads to the kstuff on-screen console (parent window).
  // Lives in the client page itself, which is always fetched at the latest commit, so it works even if the launcher bundle is stale.
  (function () {
    var p = window.parent;
    if (!p || p === window || window.__wbFwd) return;
    window.__wbFwd = true;
    var LV = ["log", "info", "warn", "error", "debug"];
    var fmt = function (a) {
      try {
        if (typeof a === "string") return a;
        if (a instanceof Error) return a.stack || a.message;
        if (a && typeof a === "object") { try { return JSON.stringify(a); } catch (e) { return Object.prototype.toString.call(a); } }
        return String(a);
      } catch (e) { return "[unprintable]"; }
    };
    var send = function (level, text) {
      try { p.postMessage({ sgConsole: true, level: level, src: "blox", text: String(text).slice(0, 3000) }, "*"); } catch (e) {}
    };
    var hook = function (m) {
      var o = console[m];
      if (typeof o !== "function" || o.__wbf) return;
      var w = function () {
        try { send(m, Array.prototype.map.call(arguments, fmt).join(" ")); } catch (e) {}
        return o.apply(console, arguments);
      };
      w.__wbf = 1;
      console[m] = w;
    };
    var ensure = function () { LV.forEach(hook); };
    ensure();
    setInterval(ensure, 1000);
    var onErr = function (e) {
      if (e.target && e.target !== window) { var u = e.target.src || e.target.href; if (u) send("error", "Failed to load " + u); return; }
      send("error", "[error] " + (e.message || "Error") + (e.filename ? " (" + String(e.filename).split("/").pop() + ":" + e.lineno + ":" + e.colno + ")" : "") + (e.error && e.error.stack ? "\n" + e.error.stack : ""));
    };
    var onRej = function (e) { send("error", "[unhandled] " + fmt(e.reason)); };
    // document.open() (used when the client swaps its page) erases every window listener, so put them back each time.
    var install = function () {
      try { addEventListener("error", onErr, true); addEventListener("unhandledrejection", onRej); } catch (e) {}
    };
    install();
    try {
      var open = document.open;
      document.open = function () { var r = open.apply(this, arguments); install(); return r; };
    } catch (e) {}
    setInterval(install, 500);
    console.log("[blox] client page started, page=" + String(window.__WB_PAGE || location.href).slice(-80));
  })();
</script>
<script>
  (function () {
    var page = window.__WB_PAGE;
    if (location.protocol !== "about:" || !page) return;
    var Real = window.URL;
    var fixBase = function (b) { b = String(b); return b === "null" || b.indexOf("about:") === 0 ? page : b; };
    window.URL = new Proxy(Real, {
      construct: function (target, args, newTarget) {
        var first = args[0];
        if (typeof first === "string" && first.indexOf("/?") === 0 && /[?&](placeId|launcher)=/.test(first)) window.__WB_NAV = first.slice(1);
        if (args.length > 1 && args[1] != null) args = [args[0], fixBase(args[1])].concat(args.slice(2));
        return Reflect.construct(target, args, newTarget);
      },
    });
    var send = function (search) {
      try { window.parent.postMessage({ type: "blox:navigate", search: search }, "*"); } catch (e) {}
    };
    window.__wbNavigate = send;
    window.__wbSearch = function () {
      try { return new Real(page).search; } catch (e) { return ""; }
    };
    var home = "";
    try { home = new Real(page).searchParams.get("launcher") === "roblox" ? "?launcher=roblox" : ""; } catch (e) {}
    Object.defineProperty(window, "__webbloxExit", {
      configurable: true,
      get: function () { return function () { send(home); }; },
      set: function () {},
    });
    var hook = function () {
      var go = window.__wbNavigate;
      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) {
          var added = records[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeType === 1 && node.classList.contains("leaving") && /placeId=/.test(window.__WB_NAV || "")) go(window.__WB_NAV);
          }
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest && e.target.closest("a[href]");
        var href = a && a.getAttribute("href");
        if (href && href.indexOf("srcdoc?") === 0) {
          e.preventDefault();
          go(href.slice(6));
        }
      }, true);
    };
    var injected = '<base href="about:srcdoc"><script>(' + hook.toString() + ')()<\/script>';
    var write = document.write;
    document.write = function (html) {
      if (typeof html === "string") html = html.replace(/<head[^>]*>/i, function (m) { return m + injected; });
      return write.call(document, html);
    };
  })();
  window.WB_ASSETS = new URL("Assets/", document.baseURI).pathname;
  window.WB_ROOT = new URL("./", document.baseURI).pathname;
</script>
</head><body><div id="wb-wait"><div id="wb-msg">Loading WebBlox</div></div>
<script>
(async () => {
  const REPO = "lotsacookie/kstuff", BRANCH = "main", DIR = "Assets/blox/";
  const msg = document.getElementById("wb-msg");
  const say = (t) => { msg.textContent = t; };
  const isSha = (s) => /^[0-9a-f]{40}$/.test(String(s || ""));

  // 1. Pin to a commit: the launcher passes the one it already got from the GitHub API (?v=), otherwise ask the API here.
  const latestSha = async () => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/commits/" + BRANCH, {
        cache: "no-store", signal: c.signal, headers: { Accept: "application/vnd.github.sha" },
      });
      if (!r.ok) throw new Error("GitHub API " + r.status);
      const sha = (await r.text()).trim();
      if (!isSha(sha)) throw new Error("bad sha");
      try { localStorage.setItem("wb-sha", sha); } catch {}
      return sha;
    } finally { clearTimeout(t); }
  };
  let sha = window.__WB_SHA || new URLSearchParams(location.search).get("v");
  if (!isSha(sha)) {
    say("Checking for the latest WebBlox…");
    sha = null;
    try { sha = await latestSha(); }
    catch (e) {
      console.warn("[pin] GitHub API failed:", e && e.message);
      try { sha = localStorage.getItem("wb-sha"); } catch {}
    }
  }
  if (!isSha(sha)) sha = null;
  window.WB_SHA = sha || String(Date.now());
  const v = window.WB_SHA.slice(0, 12);
  const CDN = sha ? "https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/" + DIR : null;
  console.log("[pin] using", window.WB_SHA);



  // Catch-all: anything that still tries to reach a Roblox host directly (fetch, Request objects, sendBeacon, XHR that slips past the engine layer)
  // is sent through the kstuff net hub instead of the browser's own network.
  (() => {
    const RBX = /(^|\.)(roblox\.com|rbxcdn\.com|robloxlabs\.com|roblox\.qq\.com|rbx\.com)$/i;
    const seen = new Set();
    const target = (input) => {
      try {
        const u = new URL(typeof input === "string" ? input : input instanceof URL ? input.href : input && input.url, location.href);
        return /^https?:$/.test(u.protocol) && RBX.test(u.hostname) ? u : null;
      } catch { return null; }
    };
    const note = (u) => { if (!seen.has(u.hostname)) { seen.add(u.hostname); console.log("[hub] proxying", u.hostname); } };
    const hubReady = async () => {
      for (let i = 0; i < 150 && !window.webbloxProxyFetch; i++) await new Promise((r) => setTimeout(r, 100));
      if (!window.webbloxProxyFetch) throw new Error("net hub not ready");
      if (window.webbloxSessionReady) { try { await window.webbloxSessionReady; } catch {} }
    };
    const viaHub = async (u, input, init) => {
      await hubReady();
      init = init || {};
      const isReq = typeof Request === "function" && input instanceof Request;
      const method = (init.method || (isReq && input.method) || "GET").toUpperCase();
      const headers = new Headers(init.headers || (isReq ? input.headers : undefined) || {});
      let body = init.body;
      if (body == null && isReq && method !== "GET" && method !== "HEAD") body = await input.clone().arrayBuffer();
      if (body instanceof Blob) body = await body.arrayBuffer();
      if (ArrayBuffer.isView(body)) body = body.buffer.slice(body.byteOffset, body.byteOffset + body.byteLength);
      return window.webbloxProxyFetch(u.href, { method, headers, body: method === "GET" || method === "HEAD" ? undefined : body, signal: init.signal });
    };
    const realFetch = window.fetch;
    window.fetch = function (input, init) {
      const u = target(input);
      if (!u) return realFetch.call(window, input, init);
      note(u);
      return viaHub(u, input, init);
    };
    if (navigator.sendBeacon) {
      const realBeacon = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = (url, data) => {
        const u = target(url);
        if (!u) return realBeacon(url, data);
        note(u);
        (async () => {
          let body = data;
          if (data instanceof Blob) body = await data.arrayBuffer();
          else if (typeof data === "string") body = new TextEncoder().encode(data).buffer;
          await viaHub(u, u.href, { method: "POST", body });
        })().catch(() => {});
        return true;
      };
    }
    const RealXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = class extends RealXHR {
      open(method, url, ...rest) {
        const u = target(url);
        if (u) { note(u); this.__hub = { method, url: u.href }; }
        return super.open(method, url, ...rest);
      }
      send(body) {
        const h = this.__hub;
        if (!h) return super.send(body);
        const fire = (name) => this.dispatchEvent(new Event(name));
        viaHub(new URL(h.url), h.url, { method: h.method, body }).then(async (r) => {
          const buf = await r.arrayBuffer();
          const type = r.headers.get("content-type") || "";
          const text = () => new TextDecoder().decode(buf);
          const rt = this.responseType;
          const val = rt === "arraybuffer" ? buf : rt === "blob" ? new Blob([buf], { type }) : rt === "json" ? JSON.parse(text()) : text();
          const def = (k, v) => Object.defineProperty(this, k, { configurable: true, value: v });
          def("status", r.status); def("statusText", r.statusText || ""); def("readyState", 4);
          def("response", val); def("responseURL", h.url);
          if (!rt || rt === "text") def("responseText", val);
          this.getResponseHeader = (n) => r.headers.get(n);
          this.getAllResponseHeaders = () => [...r.headers].map(([k, v]) => k + ": " + v).join("\r\n");
          fire("readystatechange"); fire("load"); fire("loadend");
        }).catch(() => { fire("error"); fire("loadend"); });
      }
    };
  })();

  // Route every rbxcdn.com image through the kstuff net hub (webbloxProxyFetch) instead of letting the browser load it directly.
  (() => {
    const RB = /^https?:\/\/[^/]*rbxcdn\.com\//i;
    const done = new Map();
    const hubFetch = async (url) => {
      for (let i = 0; i < 100 && !window.webbloxProxyFetch; i++) await new Promise((r) => setTimeout(r, 100));
      let last;
      for (let n = 0; n < 3; n++) {
        try {
          const r = await window.webbloxProxyFetch(url, { method: "GET", headers: { accept: "image/avif,image/webp,image/*,*/*;q=0.8" } });
          if (r.ok) { const b = await r.blob(); return URL.createObjectURL(b.type ? b : new Blob([b], { type: "image/png" })); }
          last = new Error("HTTP " + r.status);
        } catch (e) { last = e; }
      }
      throw last;
    };
    const blobFor = (url) => { if (!done.has(url)) done.set(url, hubFetch(url).catch((e) => { done.delete(url); throw e; })); return done.get(url); };
    const proto = HTMLImageElement.prototype;
    const srcDesc = Object.getOwnPropertyDescriptor(proto, "src");
    const rawSet = Element.prototype.setAttribute;
    const setRaw = (img, url) => srcDesc.set.call(img, url);
    const route = (img, url) => {
      const abs = new URL(url, location.href).href;
      img.__wbOrig = abs;
      blobFor(abs).then((b) => { if (img.__wbOrig === abs) setRaw(img, b); }, () => {});
    };
    Object.defineProperty(proto, "src", {
      configurable: true, enumerable: true,
      get() { return this.__wbOrig || srcDesc.get.call(this); },
      set(v) { RB.test(String(v)) ? route(this, String(v)) : (this.__wbOrig = null, srcDesc.set.call(this, v)); },
    });
    Element.prototype.setAttribute = function (name, value) {
      if (this instanceof HTMLImageElement && String(name).toLowerCase() === "src" && RB.test(String(value))) return void route(this, String(value));
      return rawSet.call(this, name, value);
    };
    const fix = (img) => {
      const v = img.getAttribute("src");
      if (v && RB.test(v)) { img.removeAttribute("src"); route(img, v); }
      if (img.srcset && /rbxcdn\.com/i.test(img.srcset)) img.removeAttribute("srcset");
    };
    const bg = (el) => {
      const st = el.getAttribute && el.getAttribute("style");
      const m = st && /url\(["']?(https?:\/\/[^"')]*rbxcdn\.com\/[^"')]*)["']?\)/i.exec(st);
      if (m) blobFor(m[1]).then((b) => { el.style.backgroundImage = el.style.backgroundImage.replace(m[1], b); }, () => {});
    };
    const scan = (n) => {
      if (n.nodeType !== 1) return;
      if (n instanceof HTMLImageElement) fix(n); else bg(n);
      n.querySelectorAll && n.querySelectorAll("img,[style*='rbxcdn']").forEach((e) => (e instanceof HTMLImageElement ? fix(e) : bg(e)));
    };
    new MutationObserver((recs) => {
      for (const r of recs) {
        if (r.type === "attributes") scan(r.target);
        else r.addedNodes.forEach(scan);
      }
    }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src", "srcset", "style"] });
  })();

  // 2. Core pack: jsDelivr pinned to the commit, then this site (pinned query), then raw GitHub pinned.
  const nativeFetch = window.fetch.bind(window);
  // In the srcdoc embed the page's base IS the jsDelivr URL, so the same-origin copy is not an independent source and is left out;
  // raw.githubusercontent.com (CORS-enabled) is tried right after jsDelivr, then the branch heads.
  const packSources = [
    ...(CDN ? [CDN + "Assets/core.pack.gz"] : []),
    ...(sha ? ["https://raw.githubusercontent.com/" + REPO + "/" + sha + "/" + DIR + "Assets/core.pack.gz"] : []),
    ...(location.protocol !== "about:" ? [new URL("Assets/core.pack.gz?v=" + v, document.baseURI).href] : []),
    "https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + "/" + DIR + "Assets/core.pack.gz",
    "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + DIR + "Assets/core.pack.gz",
  ];
  window.fetch = async function (input, init) {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input && input.url;
    // Site overrides (overrides/wisps.js, overrides/upstream.js) come from jsDelivr at the pinned commit, same-origin copy as the fallback.
    const ovr = url && CDN && /\/overrides\/(wisps|upstream)\.js(\?|$)/.exec(url);
    if (ovr) {
      try {
        const r = await nativeFetch(CDN + "overrides/" + ovr[1] + ".js", { credentials: "omit" });
        if (r.ok) return r;
        console.warn("[pin] override", ovr[1], r.status);
      } catch (e) { console.warn("[pin] override failed", ovr[1], e && e.message); }
    }
    if (url && /\/core\.pack\.gz(\?|$)/.test(url)) {  // the loop uses nativeFetch, so it never re-enters this wrapper
      let last;
      for (const src of packSources) {
        try {
          const r = await nativeFetch(src, { credentials: "omit" });
          if (r.ok) return r;
          last = r;
          console.warn("[pin] core pack", r.status, src);
        } catch (e) { console.warn("[pin] core pack failed", src, e && e.message); }
      }
      return last || nativeFetch(input, init);
    }
    return nativeFetch(input, init);
  };

  // 3. Scripts: jsDelivr at the pinned commit first, same-origin copy as the fallback.
  const inject = (src) => new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error("Could not load " + src)); };
    document.body.appendChild(s);
  });
  // raw.githubusercontent.com serves text/plain + nosniff, so it cannot be used as a <script src>: fetch it and run it from a blob.
  const injectText = async (src) => {
    const r = await nativeFetch(src, { credentials: "omit" });
    if (!r.ok) throw new Error(r.status + " " + src);
    const url = URL.createObjectURL(new Blob([await r.text()], { type: "text/javascript" }));
    try { await inject(url); } finally { URL.revokeObjectURL(url); }
  };
  // Independent sources, in order. A brand-new commit is often not on jsDelivr yet (it 404s and caches the miss), and the
  // srcdoc <base> points at that same jsDelivr URL, so a relative fallback is NOT independent: every source here is absolute.
  const sources = (path) => [
    ...(sha ? [() => inject("https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/" + DIR + path)] : []),
    ...(sha ? [() => injectText("https://raw.githubusercontent.com/" + REPO + "/" + sha + "/" + DIR + path)] : []),
    () => inject("https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + "/" + DIR + path + "?v=" + v),
    () => injectText("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + DIR + path),
    ...(location.protocol !== "about:" ? [() => inject(path + "?v=" + v)] : []),
  ];
  const load = async (path) => {
    const errs = [];
    for (const attempt of sources(path)) {
      try { return await attempt(); } catch (e) { errs.push(e && e.message); console.warn("[pin]", e && e.message); }
    }
    throw new Error("Could not load " + path + " (tried " + errs.length + " sources: " + errs.join("; ") + ")");
  };
  try {
    await load("Assets/js/proxy-transport.js");
    say("Connecting to the proxy…");
    await window.proxyTransport.start(say);
    say("Loading WebBlox");
    await load("Assets/games/webblox/signin.js");
    await load("Assets/games/webblox/boot.js");
  } catch (e) {
    console.error(e);
    msg.innerHTML = "";
    msg.append((e && e.message) || "WebBlox failed to start.");
    const b = document.createElement("div");
    b.innerHTML = "<button type=button>Try again</button>";
    b.firstChild.onclick = () => location.reload();
    msg.append(b);
  }
})();
</script>
</body></html>
