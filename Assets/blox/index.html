<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WebBlox</title>
<style>html,body{margin:0;height:100%;background:#18191c;color:#bdbebe;font:14px system-ui,sans-serif}#wb-wait{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}#wb-wait button{margin-top:12px;padding:8px 16px;border:0;border-radius:6px;background:#335fff;color:#fff;font:inherit;cursor:pointer}</style>
<script>
  (function () {
    var page = window.__WB_PAGE;
    if (location.protocol !== "about:" || !page) return;
    var Real = window.URL;
    var fixBase = function (b) { b = String(b); return b === "null" || b.indexOf("about:") === 0 ? page : b; };
    window.URL = new Proxy(Real, {
      construct: function (target, args, newTarget) {
        var first = args[0];
        if (typeof first === "string" && first.indexOf("/?") === 0 && /[?&](placeId|launcher)=/.test(first)) window.__WB_NAV = first.slice(1);
        if (args.length > 1 && args[1] != null) args = [args[0], fixBase(args[1])].concat(args.slice(2));
        return Reflect.construct(target, args, newTarget);
      },
    });
    var send = function (search) {
      try { window.parent.postMessage({ type: "blox:navigate", search: search }, "*"); } catch (e) {}
    };
    window.__wbNavigate = send;
    window.__wbSearch = function () {
      try { return new Real(page).search; } catch (e) { return ""; }
    };
    var home = "";
    try { home = new Real(page).searchParams.get("launcher") === "roblox" ? "?launcher=roblox" : ""; } catch (e) {}
    Object.defineProperty(window, "__webbloxExit", {
      configurable: true,
      get: function () { return function () { send(home); }; },
      set: function () {},
    });
    var hook = function () {
      var go = window.__wbNavigate;
      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) {
          var added = records[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeType === 1 && node.classList.contains("leaving") && /placeId=/.test(window.__WB_NAV || "")) go(window.__WB_NAV);
          }
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest && e.target.closest("a[href]");
        var href = a && a.getAttribute("href");
        if (href && href.indexOf("srcdoc?") === 0) {
          e.preventDefault();
          go(href.slice(6));
        }
      }, true);
    };
    var injected = '<base href="about:srcdoc"><script>(' + hook.toString() + ')()<\/script>';
    var write = document.write;
    document.write = function (html) {
      if (typeof html === "string") html = html.replace(/<head[^>]*>/i, function (m) { return m + injected; });
      return write.call(document, html);
    };
  })();
  window.WB_ASSETS = new URL("Assets/", document.baseURI).pathname;
  window.WB_ROOT = new URL("./", document.baseURI).pathname;
</script>
</head><body><div id="wb-wait"><div id="wb-msg">Loading WebBlox</div></div>
<script>
(async () => {
  const REPO = "lotsacookie/kstuff", BRANCH = "main", DIR = "Assets/blox/";
  const msg = document.getElementById("wb-msg");
  const say = (t) => { msg.textContent = t; };
  const isSha = (s) => /^[0-9a-f]{40}$/.test(String(s || ""));

  // 1. Pin to a commit: the launcher passes the one it already got from the GitHub API (?v=), otherwise ask the API here.
  const latestSha = async () => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/commits/" + BRANCH, {
        cache: "no-store", signal: c.signal, headers: { Accept: "application/vnd.github.sha" },
      });
      if (!r.ok) throw new Error("GitHub API " + r.status);
      const sha = (await r.text()).trim();
      if (!isSha(sha)) throw new Error("bad sha");
      try { localStorage.setItem("wb-sha", sha); } catch {}
      return sha;
    } finally { clearTimeout(t); }
  };
  let sha = window.__WB_SHA || new URLSearchParams(location.search).get("v");
  if (!isSha(sha)) {
    say("Checking for the latest WebBlox…");
    sha = null;
    try { sha = await latestSha(); }
    catch (e) {
      console.warn("[pin] GitHub API failed:", e && e.message);
      try { sha = localStorage.getItem("wb-sha"); } catch {}
    }
  }
  if (!isSha(sha)) sha = null;
  window.WB_SHA = sha || String(Date.now());
  const v = window.WB_SHA.slice(0, 12);
  const CDN = sha ? "https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/" + DIR : null;
  console.log("[pin] using", window.WB_SHA);

  // 2. Core pack: jsDelivr pinned to the commit, then this site (pinned query), then raw GitHub pinned.
  const nativeFetch = window.fetch.bind(window);
  const packSources = [
    ...(CDN ? [CDN + "Assets/core.pack.gz"] : []),
    new URL("Assets/core.pack.gz?v=" + v, document.baseURI).href,
    ...(sha ? ["https://raw.githubusercontent.com/" + REPO + "/" + sha + "/" + DIR + "Assets/core.pack.gz"] : []),
  ];
  window.fetch = async function (input, init) {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input && input.url;
    // Site overrides (overrides/wisps.js, overrides/upstream.js) come from jsDelivr at the pinned commit, same-origin copy as the fallback.
    const ovr = url && CDN && /\/overrides\/(wisps|upstream)\.js(\?|$)/.exec(url);
    if (ovr) {
      try {
        const r = await nativeFetch(CDN + "overrides/" + ovr[1] + ".js", { credentials: "omit" });
        if (r.ok) return r;
        console.warn("[pin] override", ovr[1], r.status);
      } catch (e) { console.warn("[pin] override failed", ovr[1], e && e.message); }
    }
    if (url && /\/core\.pack\.gz(\?|$)/.test(url) && !packSources.includes(url)) {
      let last;
      for (const src of packSources) {
        try {
          const r = await nativeFetch(src, { credentials: "omit" });
          if (r.ok) return r;
          last = r;
          console.warn("[pin] core pack", r.status, src);
        } catch (e) { console.warn("[pin] core pack failed", src, e && e.message); }
      }
      return last || nativeFetch(input, init);
    }
    return nativeFetch(input, init);
  };

  // 3. Scripts: jsDelivr at the pinned commit first, same-origin copy as the fallback.
  const inject = (src) => new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error("Could not load " + src)); };
    document.body.appendChild(s);
  });
  // raw.githubusercontent.com serves text/plain + nosniff, so it cannot be used as a <script src>: fetch it and run it from a blob.
  const injectText = async (src) => {
    const r = await nativeFetch(src, { credentials: "omit" });
    if (!r.ok) throw new Error(r.status + " " + src);
    const url = URL.createObjectURL(new Blob([await r.text()], { type: "text/javascript" }));
    try { await inject(url); } finally { URL.revokeObjectURL(url); }
  };
  // Independent sources, in order. A brand-new commit is often not on jsDelivr yet (it 404s and caches the miss), and the
  // srcdoc <base> points at that same jsDelivr URL, so a relative fallback is NOT independent: every source here is absolute.
  const sources = (path) => [
    ...(sha ? [() => inject("https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/" + DIR + path)] : []),
    ...(sha ? [() => injectText("https://raw.githubusercontent.com/" + REPO + "/" + sha + "/" + DIR + path)] : []),
    () => inject("https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + "/" + DIR + path + "?v=" + v),
    () => injectText("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + DIR + path),
    ...(location.protocol !== "about:" ? [() => inject(path + "?v=" + v)] : []),
  ];
  const load = async (path) => {
    const errs = [];
    for (const attempt of sources(path)) {
      try { return await attempt(); } catch (e) { errs.push(e && e.message); console.warn("[pin]", e && e.message); }
    }
    throw new Error("Could not load " + path + " (tried " + errs.length + " sources: " + errs.join("; ") + ")");
  };
  try {
    await load("Assets/js/proxy-transport.js");
    say("Connecting to the proxy…");
    await window.proxyTransport.start(say);
    say("Loading WebBlox");
    await load("Assets/games/webblox/signin.js");
    await load("Assets/games/webblox/boot.js");
  } catch (e) {
    console.error(e);
    msg.innerHTML = "";
    msg.append((e && e.message) || "WebBlox failed to start.");
    const b = document.createElement("div");
    b.innerHTML = "<button type=button>Try again</button>";
    b.firstChild.onclick = () => location.reload();
    msg.append(b);
  }
})();
</script>
</body></html>
