<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WebBlox</title>
<style>html,body{margin:0;height:100%;background:#18191c;color:#bdbebe;font:14px system-ui,sans-serif}#wb-wait{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}#wb-wait button{margin-top:12px;padding:8px 16px;border:0;border-radius:6px;background:#335fff;color:#fff;font:inherit;cursor:pointer}</style>
<script>
  window.WB_ASSETS = new URL("Assets/", document.baseURI).pathname;
  window.WB_ROOT = new URL("./", document.baseURI).pathname;
</script>
</head><body><div id="wb-wait"><div id="wb-msg">Loading WebBlox</div></div>
<script>
(async () => {
  const REPO = "lotsacookie/kstuff", BRANCH = "main", DIR = "Assets/blox/";
  const msg = document.getElementById("wb-msg");
  const say = (t) => { msg.textContent = t; };
  const isSha = (s) => /^[0-9a-f]{40}$/.test(String(s || ""));

  // 1. Pin to a commit: the launcher passes the one it already got from the GitHub API (?v=), otherwise ask the API here.
  const latestSha = async () => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/commits/" + BRANCH, {
        cache: "no-store", signal: c.signal, headers: { Accept: "application/vnd.github.sha" },
      });
      if (!r.ok) throw new Error("GitHub API " + r.status);
      const sha = (await r.text()).trim();
      if (!isSha(sha)) throw new Error("bad sha");
      try { localStorage.setItem("wb-sha", sha); } catch {}
      return sha;
    } finally { clearTimeout(t); }
  };
  let sha = new URLSearchParams(location.search).get("v");
  if (!isSha(sha)) {
    say("Checking for the latest WebBlox…");
    sha = null;
    try { sha = await latestSha(); }
    catch (e) {
      console.warn("[pin] GitHub API failed:", e && e.message);
      try { sha = localStorage.getItem("wb-sha"); } catch {}
    }
  }
  if (!isSha(sha)) sha = null;
  window.WB_SHA = sha || String(Date.now());
  const v = window.WB_SHA.slice(0, 12);
  const CDN = sha ? "https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/" + DIR : null;
  console.log("[pin] using", window.WB_SHA);

  // 2. Core pack: jsDelivr pinned to the commit, then this site (pinned query), then raw GitHub pinned.
  const nativeFetch = window.fetch.bind(window);
  const packSources = [
    ...(CDN ? [CDN + "Assets/core.pack.gz"] : []),
    new URL("Assets/core.pack.gz?v=" + v, document.baseURI).href,
    ...(sha ? ["https://raw.githubusercontent.com/" + REPO + "/" + sha + "/" + DIR + "Assets/core.pack.gz"] : []),
  ];
  window.fetch = async function (input, init) {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input && input.url;
    if (url && /\/core\.pack\.gz(\?|$)/.test(url) && !packSources.includes(url)) {
      let last;
      for (const src of packSources) {
        try {
          const r = await nativeFetch(src, { credentials: "omit" });
          if (r.ok) return r;
          last = r;
          console.warn("[pin] core pack", r.status, src);
        } catch (e) { console.warn("[pin] core pack failed", src, e && e.message); }
      }
      return last || nativeFetch(input, init);
    }
    return nativeFetch(input, init);
  };

  // 3. Scripts: jsDelivr at the pinned commit first, same-origin copy as the fallback.
  const inject = (src) => new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error("Could not load " + src)); };
    document.body.appendChild(s);
  });
  const load = async (path) => {
    if (CDN) { try { return await inject(CDN + path); } catch (e) { console.warn("[pin]", e.message); } }
    return inject(path + "?v=" + v);
  };
  try {
    await load("Assets/js/proxy-transport.js");
    say("Connecting to the proxy…");
    await window.proxyTransport.start(say);
    say("Loading WebBlox");
    await load("Assets/games/webblox/signin.js");
    await load("Assets/games/webblox/boot.js");
  } catch (e) {
    console.error(e);
    msg.innerHTML = "";
    msg.append((e && e.message) || "WebBlox failed to start.");
    const b = document.createElement("div");
    b.innerHTML = "<button type=button>Try again</button>";
    b.firstChild.onclick = () => location.reload();
    msg.append(b);
  }
})();
</script>
</body></html>
