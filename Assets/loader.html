<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="fm" src="about:blank"></iframe>
<script>
(function() {
  async function coiGate() {
    try {
      if (window.crossOriginIsolated) return false;
      if (!('serviceWorker' in navigator)) return false;
      if (sessionStorage.getItem('coi-tried')) return false;
      sessionStorage.setItem('coi-tried', '1');
      await navigator.serviceWorker.register(new URL('coi-sw.js', location.href).href);
      await navigator.serviceWorker.ready;
      location.reload();
      return true;
    } catch (e) { console.warn('coi', e); return false; }
  }

  (async () => {
    if (await coiGate()) return;
    try {
      const url = 'https://cdn.jsdelivr.net/gh/lotsacookie/kstuff@main/Assets/loader-ab.html?t=' + Date.now();
      const res = await fetch(url);
      const text = await res.text();
      const frame = document.getElementById('fm');
      const fdoc = frame.contentDocument || frame.contentWindow.document;
      fdoc.open();
      fdoc.write(text);
      fdoc.close();
    } catch (e) {
      console.error('Loader error:', e);
    }
  })();
})();
</script>
</body>
</html>
