name: GeForce NOW catalog

on:
  push:
    branches: [main]
    paths:
      - Assets/now/extra.json
      - tools/gfn/build-catalog.mjs
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gfn-catalog

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/gfn/build-catalog.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/now/catalog.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update GeForce NOW catalog" && git pull --rebase -q && git push; fi
