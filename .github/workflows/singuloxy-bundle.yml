name: Bundle Singuloxy

on:
  push:
    branches: [main]
    paths:
      - 'Assets/singuloxy/**'
      - '.github/workflows/singuloxy-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singuloxy-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Singuloxy library (webpack, production)
        working-directory: Assets/singuloxy
        run: |
          npm install --no-audit --no-fund
          npm run build:prod

      - name: Build Singuloxy example (single-file bundle)
        working-directory: Assets/singuloxy/example
        run: |
          npm install --no-audit --no-fund
          npm run build:prod

      - name: Collect output into Assets/build
        run: |
          rm -rf Assets/build
          mkdir -p Assets/build
          cp Assets/singuloxy/dist/sandstone.js        Assets/build/
          cp Assets/singuloxy/dist/sandstone.mjs       Assets/build/
          cp Assets/singuloxy/dist/sandstone_frame.js  Assets/build/
          if [ -f Assets/singuloxy/example/bundled.html ]; then
            cp Assets/singuloxy/example/bundled.html Assets/build/singuloxy.html
          elif [ -f Assets/singuloxy/example/dist/bundled.html ]; then
            cp Assets/singuloxy/example/dist/bundled.html Assets/build/singuloxy.html
          fi
          printf '# Generated by .github/workflows/singuloxy-bundle.yml - do not edit by hand.\n' > Assets/build/README.md
          FILES=$(cd Assets/build && ls | grep -v -e README.md | sed 's/.*/"&"/' | paste -sd, -)
          printf '{\n  "source": "Assets/singuloxy",\n  "commit": "%s",\n  "built": "%s",\n  "files": [%s]\n}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$FILES" > Assets/build/manifest.json
          ls -la Assets/build

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets/build
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "build: bundle singuloxy [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1

      - name: Purge jsDelivr cache
        run: |
          for f in sandstone.js sandstone.mjs sandstone_frame.js singuloxy.html manifest.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/Assets/build/$f" || true
          done
