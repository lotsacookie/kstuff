<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex">
    <title>Singularity</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='24 24 52 52'%3E%3Cpath fill='%23ffffff' d='M50.0 29.0 L51.7 45.8 L58.5 41.5 L54.2 48.3 L71.0 50.0 L54.2 51.7 L58.5 58.5 L51.7 54.2 L50.0 71.0 L48.3 54.2 L41.5 58.5 L45.8 51.7 L29.0 50.0 L45.8 48.3 L41.5 41.5 L48.3 45.8 Z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <script>window.addEventListener("beforeunload",e=>{e.preventDefault();e.returnValue=""});</script>
    <script>(()=>{
        const nav = window.navigation;
        if (!nav || !nav.addEventListener) return;
        nav.addEventListener('navigate', e => {
            try {
                if (!e.cancelable) return;
                if (e.hashChange || e.downloadRequest !== null) return;
                if (e.navigationType === 'traverse' || e.navigationType === 'reload') return;
                if (e.userInitiated) return;
                const dest = new URL(e.destination.url);
                if (dest.origin === location.origin && dest.pathname === location.pathname && dest.search === location.search) return;
                e.preventDefault();
            } catch {}
        });
    })();</script>
    <style>
        :root{--bg-color:#000000;--text-color:#ffffff;--nav-bg:#0a0a0a;--card-bg:#141414;color-scheme:dark}
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;background:var(--bg-color);color:var(--text-color);overflow:hidden}
        body{font-family:"Comfortaa",sans-serif;font-weight:600;-webkit-font-smoothing:antialiased}
        #shutdown{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background-color:var(--bg-color);color:var(--text-color);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4rem;padding:1.5rem;text-align:center;contain:layout paint}
        #shutdown::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,color-mix(in srgb,var(--text-color) 14%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--text-color) 14%,transparent) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;opacity:0;animation:sd-bg-in 1.6s ease .1s both}
        #shutdown>*{position:relative;opacity:0;animation:sd-in 1s cubic-bezier(.22,1,.36,1) both}
        #shutdown>.sd-logo{animation-delay:.25s}
        #shutdown>.sd-word{animation-delay:.45s}
        #shutdown>.sd-bar{animation-delay:.65s}
        #shutdown>.sd-msg{animation-delay:.8s}
        .sd-logo{width:5.5rem;height:5.5rem;overflow:visible}
        .sd-core{transform-origin:50px 50px;animation:sd-pulse 2.8s ease-in-out infinite}
        .sd-word{font-size:.8rem;font-weight:600;letter-spacing:.5em;text-transform:uppercase;margin-right:-.5em}
        .sd-bar{width:min(240px,60vw);height:1px;overflow:hidden;background:color-mix(in srgb,var(--text-color) 14%,transparent)}
        .sd-bar::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(90deg,transparent,var(--text-color),transparent);animation:sd-sheen 2.4s ease-in-out infinite}
        .sd-msg{max-width:34rem;font-size:.95rem;line-height:1.7;letter-spacing:.04em;opacity:.8}
        @keyframes sd-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        @keyframes sd-bg-in{from{opacity:0}to{opacity:1}}
        @keyframes sd-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
        @keyframes sd-sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
        @media (prefers-reduced-motion:reduce){.sd-core,.sd-bar::after{animation:none}#shutdown::before{animation:sd-bg-in .01s both}#shutdown>*{opacity:1;animation:none}}
    </style>
</head>
<body class="theme-pitch-black">
    <div id="shutdown">
        <svg class="sd-logo" viewBox="24 24 52 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g class="sd-core" fill="currentColor">
                <path d="M50.0 29.0 L51.7 45.8 L58.5 41.5 L54.2 48.3 L71.0 50.0 L54.2 51.7 L58.5 58.5 L51.7 54.2 L50.0 71.0 L48.3 54.2 L41.5 58.5 L45.8 51.7 L29.0 50.0 L45.8 48.3 L41.5 41.5 L48.3 45.8 Z"/>
            </g>
        </svg>
        <div class="sd-word">Singularity</div>
        <div class="sd-bar"></div>
        <p class="sd-msg">Site it shutdown temporarily to rid of admins going through it, be back soon!</p>
    </div>
</body>
</html>
